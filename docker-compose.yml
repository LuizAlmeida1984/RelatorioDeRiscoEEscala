version: "3.9"

services:
  app:
    restart: unless-stopped
    image: php:8.4-fpm
    container_name: laravel_app2
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      - db

  nginx:
    restart: unless-stopped
    image: nginx:latest
    container_name: nginx_server2
    ports:
      - "81:81"
    volumes:
      - ./backend:/var/www
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    restart: unless-stopped
    image: postgres:15
    container_name: postgres_db2
    environment:
      POSTGRES_DB: roi_payback
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: desenv

    volumes:
      - pgdata2:/var/lib/postgresql/data

volumes:
  pgdata2:
